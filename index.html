   emergency first, then a live "open now" list, getting around, things to do and practical tips.

:root{

}

  --bg:#0d1517; --surface:#142023; --hover:#1a2a2e; --ink:#e3ebe9; --muted:#93a5a2; --line:#24353a;
  --sea:#5fb3c7; --lamp:#f0874f; --open:#6cc48f; --alert:#ff7a6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1517; --surface:#142023; --hover:#1a2a2e; --ink:#e3ebe9; --muted:#93a5a2; --line:#24353a;
  --sea:#5fb3c7; --lamp:#f0874f; --open:#6cc48f; --alert:#ff7a6e; color-scheme:dark}

:root[lang="hi"]{--display:"Tiro Devanagari Hindi", "Noto Sans Devanagari", serif}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.page{max-width:720px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:30px}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(36px,9vw,54px)}

h2{font-size:30px}
h3{font-size:16px;font-weight:700;margin:0}
p{margin:0}
a{color:var(--sea);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px;border-radius:6px}
.langs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.langs span{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.langs button{font:inherit;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--surface)}
.lede{color:var(--muted);max-width:60ch;margin-top:10px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lamp)}
.now{margin-top:12px;font-size:14px;color:var(--muted)}
.now b{color:var(--ink);font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:12px}
.sub{color:var(--muted);font-size:14.5px;margin-top:-4px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:13px 16px;border-top:1px solid var(--line);
  color:inherit;text-decoration:none;align-items:center}
.item:first-child{border-top:0}
a.item:hover,a.card:hover{background:var(--hover)}
.item .ttl{display:flex;align-items:center;gap:7px;min-width:0}
.item .ttl .ico{color:var(--sea)}
.item p{grid-column:1 / -1;color:var(--muted);font-size:14.5px}
.call{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
  color:var(--sea);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.sos{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center;text-decoration:none;color:inherit;
  background:var(--surface);border:2px solid var(--alert);border-radius:12px;padding:16px}
.sos .big{font-family:"Instrument Serif", Georgia, serif;font-size:64px;line-height:.9;color:var(--alert);grid-row:span 2}
.sos p{color:var(--muted);font-size:14.5px}
.status{font-size:14px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.status.open{color:var(--open)}
.status.shut{color:var(--muted);font-weight:500}
.status.open::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--open);margin-right:6px;vertical-align:1px}
.tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;
  min-width:0;color:inherit;text-decoration:none}
.card p{color:var(--muted);font-size:14.5px}
.card .meta{font-size:13px;color:var(--sea);font-weight:600;display:flex;gap:6px;align-items:center;margin-top:auto}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.word{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.word b{font-family:"Instrument Serif", Georgia, serif;font-size:24px;font-weight:400;display:block;line-height:1.1}
.word span{font-size:13px;color:var(--muted)}
ul.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:62ch}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

  reykjavik_h: "Рейкьявик", reykjavik_p: "На машине через тоннель или автобусом 50 до Mjódd, дальше городскими автобусами.",
  snaefellsnes_h: "Полуостров Снайфедльснес", snaefellsnes_p: "Гора Киркьюфедль, чёрные пляжи и ледник Снайфедльсйёкюдль. На целый день; зимой выезжайте рано.",
  tips_h: "Полезно знать", tips: [
    "Водопроводная вода отличная; горячая вода слегка пахнет серой. Это нормально.",
    "В бассейне перед входом в воду нужно принять душ без купальника. Это правило, и персонал напомнит.",
    "Карты принимают везде, даже для небольших сумм. Чаевые не обязательны.",
    "Алкоголь на вынос продаётся только в Vínbúðin, не в супермаркетах.",
    "Погода меняется быстро. Смотрите прогноз ветра, а не только температуру.",
    "Сезон северного сияния с сентября по апрель; прогноз облачности на vedur.is показывает, где небо ясное."],
  w_thanks: "Спасибо", w_morning: "Доброе утро", w_cheers: "За здоровье!", w_bye: "Пока",
  footer: "Часы работы проверены в октябре 2026 года по сайтам самих заведений. Если что-то не так, спросите нас."
}};

/* ===== small helpers ===== */
var ICON = {
  pin: "<svg class='ico' viewBox='0 0 24 24' aria-hidden='true'><path d='M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z'/><circle cx='12' cy='9.5' r='2.5'/></svg>",
  web: "<svg class='ico' viewBox='0 0 24 24' aria-hidden='true'><path d='M14 4h6v6M20 4l-9 9'/><path d='M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5'/></svg>",
  phone: "<svg class='ico' viewBox='0 0 24 24' aria-hidden='true'><path d='M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z'/></svg>"
};
var lang = "en";
function t(k) { return (T[lang][k] !== undefined ? T[lang][k] : T.en[k]); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function fill(s, o) { return s.replace(/\{(\w+)\}/g, function (m, k) { return o[k] !== undefined ? o[k] : m; }); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function hm(mins) { return pad(Math.floor(mins / 60) % 24) + ":" + pad(mins % 60); }
function linkAttrs(href) { return "href='" + esc(href) + "' target='_blank' rel='noopener'"; }

/* ===== opening-hours logic, in Iceland time (UTC all year; guests' phones may be on home time) ===== */
function weekFor(p, day) {
  if (p.w) return p.w;
  var md = pad(day.getUTCMonth() + 1) + "-" + pad(day.getUTCDate());
  for (var i = 0; i < p.seasons.length; i++) {
    var s = p.seasons[i], wraps = s.from > s.to;
    if (wraps ? (md >= s.from || md <= s.to) : (md >= s.from && md <= s.to)) return s.w;
  }
  return ["", "", "", "", "", "", ""];
}
function slot(p, day) {
  var v = weekFor(p, day)[day.getUTCDay()];
  if (!v) return null;
  var a = v.split("-"), o = a[0].split(":"), c = a[1].split(":");
  return { open: +o[0] * 60 + +o[1], close: +c[0] * 60 + +c[1] };
}
function status(p, now) {
  var today = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
  var mins = now.getUTCHours() * 60 + now.getUTCMinutes(), s = slot(p, today);
  if (s && mins >= s.open && mins < s.close) return { open: true, text: fill(t("open"), { t: hm(s.close) }) };
  if (s && mins < s.open) return { open: false, text: fill(t("opens"), { t: hm(s.open) }) };
  for (var i = 1; i <= 7; i++) {
    var d = new Date(today.getTime() + i * 864e5), n = slot(p, d);
    if (n) return { open: false, text: i === 1 ? fill(t("opensTomorrow"), { t: hm(n.open) }) : fill(t("opensDay"), { d: t("days")[d.getUTCDay()], t: hm(n.open) }) };
  }
  return { open: false, text: t("closed") };
}
function statusHtml(st) { return "<span class='status " + (st.open ? "open" : "shut") + "'>" + esc(st.text) + "</span>"; }
function byName(n) { for (var i = 0; i < PLACES.length; i++) if (PLACES[i].name === n) return PLACES[i]; }

/* ===== render the whole page in the chosen language ===== */
function render() {
  var now = new Date(), h = "", i;
  document.documentElement.lang = lang;
  var nodes = document.querySelectorAll("[data-t]");
  for (i = 0; i < nodes.length; i++) nodes[i].textContent = t(nodes[i].getAttribute("data-t"));
  nodes = document.querySelectorAll("[data-h]");
  for (i = 0; i < nodes.length; i++) nodes[i].innerHTML = t(nodes[i].getAttribute("data-h"));
  document.getElementById("langs").innerHTML = "<span>" + esc(t("lang")) + "</span>" + LANGS.map(function (l) {
    return "<button type='button' data-lang='" + l[0] + "' aria-pressed='" + (l[0] === lang) + "' lang='" + l[0] + "'>" + l[1] + "</button>";
  }).join("");
  document.getElementById("now").innerHTML = esc(t("now")) + " <b>" + pad(now.getUTCHours()) + ":" + pad(now.getUTCMinutes()) + "</b> · " +
    esc(t("days")[now.getUTCDay()]) + " " + now.getUTCDate() + " " + esc(t("months")[now.getUTCMonth()]);

  // help: numbers to call, health care with map links
  h = "";
  for (i = 0; i < HELP.length; i++) {
    var x = HELP[i];
    if (x.key === "trip") {
      h += "<div class='item'><div class='ttl'><h3>" + esc(t("trip_h")) + "</h3></div><span></span><p>" + fill(esc(t("trip_p")), {
        safetravel: "<a " + linkAttrs("https://safetravel.is") + ">safetravel.is</a>",
        umferdin: "<a " + linkAttrs("https://umferdin.is") + ">umferdin.is</a>",
        vedur: "<a " + linkAttrs("https://en.vedur.is") + ">vedur.is</a>" }) + "</p></div>";
      continue;
    }
    var title = x.link ? "<a class='ttl' " + linkAttrs(x.link) + ">" + ICON.pin + "<h3>" + esc(t(x.key + "_h")) + "</h3></a>" : "<div class='ttl'><h3>" + esc(t(x.key + "_h")) + "</h3></div>";
    var st = x.w ? " " + statusHtml(status(x, now)) : "";
    h += "<div class='item'>" + title + "<a class='call' href='tel:" + x.tel.replace(/ /g, "") + "' aria-label='" + esc(t("call")) + " " + x.tel + "'>" + ICON.phone + x.tel + "</a>" +
      "<p>" + esc(t(x.key + "_p")) + st + "</p></div>";
  }
  document.getElementById("help").innerHTML = h;

  // open now: every row opens the map or the website
  document.getElementById("legend").innerHTML = "<span>" + ICON.pin + esc(t("map")) + "</span><span>" + ICON.web + esc(t("site")) + "</span>";
  h = "";
  for (i = 0; i < PLACES.length; i++) {
    var p = PLACES[i];
    h += "<a class='item' " + linkAttrs(p.link) + "><div class='ttl'>" + (p.web ? ICON.web : ICON.pin) + "<h3>" + esc(p.name) + "</h3></div>" +
      statusHtml(status(p, now)) + "<p>" + esc(t("n_" + p.note)) + (p.addr ? " · " + esc(p.addr) : "") + "</p></a>";
  }
  document.getElementById("places").innerHTML = h;

  // cards
  function cards(list, withLink) {
    return list.map(function (c) {
      var meta = c.status ? statusHtml(status(byName(c.status), now)) : "";
      var linkText = withLink ? esc(t(c.key + "_l")) : (c.web ? esc(t("site")) : esc(t("map")));
      return "<a class='card' " + linkAttrs(c.link) + "><span class='tag'>" + esc(t(c.key + "_tag")) + "</span><h3>" + esc(t(c.key + "_h")) + "</h3>" +
        "<p>" + esc(t(c.key + "_p")) + "</p>" + (meta ? "<div>" + meta + "</div>" : "") +
        "<span class='meta'>" + (c.web ? ICON.web : ICON.pin) + linkText + "</span></a>";
    }).join("");
  }
  document.getElementById("move").innerHTML = cards(MOVE, true);
  document.getElementById("town").innerHTML = cards(TOWN, false);

  // day trips
  document.getElementById("near").innerHTML = NEAR.map(function (n) {
    var dur = n.mins < 60 ? fill(t("min"), { n: n.mins }) : fill(t("hour"), { n: n.mins / 60 });
    return "<a class='item' " + linkAttrs(n.link) + "><div class='ttl'>" + ICON.pin + "<h3>" + esc(t(n.key + "_h")) + "</h3></div><span class='tag'>" + esc(dur) + "</span>" +
      "<p>" + esc(t(n.key + "_p")) + "</p></a>";
  }).join("");

  document.getElementById("tips").innerHTML = t("tips").map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("");
  document.getElementById("words").innerHTML = WORDS.map(function (w) {
    return "<div class='word'><b lang='is'>" + esc(w[0]) + "</b><span>" + esc(t(w[1])) + "</span></div>";
  }).join("");
}

/* ===== language: #de etc. in the link, then the saved choice, then the phone's language ===== */
function pick() {
  var hash = location.hash.replace("#", "");
  if (T[hash]) return hash;
  try { var saved = localStorage.getItem("guide-lang"); if (T[saved]) return saved; } catch (e) {}
  var prefs = navigator.languages || [navigator.language || "en"];
  for (var i = 0; i < prefs.length; i++) { var code = String(prefs[i]).slice(0, 2).toLowerCase(); if (T[code]) return code; }
  return "en";
}
document.getElementById("langs").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-lang]");
  if (!b) return;
  lang = b.getAttribute("data-lang");
  try { localStorage.setItem("guide-lang", lang); } catch (err) {}
  render();
});
lang = pick();
render();
setInterval(render, 30000);
</script>
